name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # Public origin is unused in tests but required by the app at boot
  APP_URL: http://localhost:3100

jobs:
  lint-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # next build re-runs ESLint and fails on errors - the exact check
      # that caught the deploy blocker on Railway
      - run: pnpm build

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  a11y:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kaja
          POSTGRES_PASSWORD: kaja
          POSTGRES_DB: kaja
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaja"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://kaja:kaja@localhost:5432/kaja
      # Non-secret test value; real deployments set their own.
      SESSION_SECRET: ci-only-non-secret-please-override
      # Seed the demo user used by the e2e login (config file is not
      # committed - it holds real passwords).
      USERS_JSON: '[{"username":"demo","password":"demo123"}]'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - name: Run a11y audits
        run: pnpm test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
